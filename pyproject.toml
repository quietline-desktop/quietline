[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "quietline-engine"
version = "0.1.0"
description = "Движок пространств и окон Quietline для Hyprland"
requires-python = ">=3.14"
license = "GPL-3.0-only"
license-files = ["LICENSE"]
dependencies = []

[dependency-groups]
dev = ["pytest>=8"]

[tool.hatch.build.targets.wheel]
packages = ["src/quietline_engine"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
