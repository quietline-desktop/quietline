# Каталог программ установщика Quietline: что ставится, откуда и что закрепляется в доке.
# Схема и правила — в docstring src/quietline_install/catalog.py.
# desktop: code не подтверждён на живой системе (docs/backlog.md).

[core]
packages = [
  "hyprland", "hyprpm", "quickshell", "greetd", "greetd-tuigreet",
  "xdg-desktop-portal-hyprland", "xdg-desktop-portal-gtk", "hyprpolkitagent", "hypridle", "gnome-keyring", "qt6-wayland", "polkit",
  "pipewire", "pipewire-pulse", "wireplumber", "networkmanager", "bluez", "bluez-utils",
  "power-profiles-daemon", "brightnessctl", "upower", "libnotify", "glib2",
  "xdg-user-dirs", "xdg-utils", "flatpak",
  "inter-font", "ttf-material-symbols-variable", "ttf-jetbrains-mono", "ttf-ibm-plex", "ttf-jetbrains-mono-nerd",
  "noto-fonts", "noto-fonts-emoji", "capitaine-cursors",
  "grim", "slurp", "satty", "wl-clipboard", "cliphist", "plocate",
  "ghostty", "fish", "fisher", "micro", "git", "openssh", "curl", "base-devel", "unzip",
]
services = ["NetworkManager.service", "bluetooth.service", "power-profiles-daemon.service"]
# Помощник AUR для программ, которые пользователь ставит сам, и для обновления всех пакетов.
aur = ["yay-bin"]
# Терминал основы закрепляется в доке всегда.
desktop = "com.mitchellh.ghostty"
pin = "terminal"

