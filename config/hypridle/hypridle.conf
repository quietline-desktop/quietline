# Quietline: простой и сон. hypridle запускает Hyprland (quietline.lua) с этим файлом:
# hypridle -c /usr/share/quietline/hypridle/hypridle.conf
#
# Блокировка — тот же экран, что у Super+L. Перед любым сном logind ждёт, пока экран
# блокировки подтвердит блокировку. Запреты простоя от приложений (видео, звонки) по
# Wayland, D-Bus и systemd-inhibit, а также «Не засыпать» оболочки откладывают все сроки.

general {
    lock_cmd = quietline-shell lock
    before_sleep_cmd = loginctl lock-session
    after_sleep_cmd = hyprctl dispatch 'hl.dsp.dpms({ action = "enable" })'
    inhibit_sleep = 3
    ignore_dbus_inhibit = false
    ignore_systemd_inhibit = false
    ignore_wayland_inhibit = false
}

# 5 минут — блокировка.
listener {
    timeout = 300
    on-timeout = loginctl lock-session
}

# 5,5 минуты — экраны гаснут; любое действие включает их снова.
listener {
    timeout = 330
    on-timeout = hyprctl dispatch 'hl.dsp.dpms({ action = "disable" })'
    on-resume = hyprctl dispatch 'hl.dsp.dpms({ action = "enable" })'
}

# 15 минут — сон, только от своей батареи.
listener {
    timeout = 900
    on-timeout = quietline-shell idle suspend
}
