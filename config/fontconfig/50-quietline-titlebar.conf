<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<!-- Шрифт заголовков окон Quietline (hyprbars): название — Inter, значки кнопок (кодовые
     точки Material Symbols из личной области Unicode) — Material Symbols Rounded раньше
     любого запасного шрифта, где те же точки заняты другими глифами. -->
<fontconfig>
  <alias binding="same">
    <family>Quietline Titlebar</family>
    <prefer>
      <family>Inter</family>
      <family>Material Symbols Rounded</family>
    </prefer>
  </alias>
</fontconfig>
